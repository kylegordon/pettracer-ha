name: Test

on:
  push:
    branches: [master, main, dev]
  pull_request:
    branches: [master, main, dev]
  workflow_dispatch:

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test.txt $(jq -r '.requirements[]' custom_components/pettracer/manifest.json)

      - name: Run tests with coverage
        run: |
          pytest --cov=custom_components.pettracer --cov-branch --cov-report=xml --cov-report=term -v

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

      - name: Generate coverage report
        run: |
          pip install coverage
          coverage report --fail-under=90

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: 'pip'

      - name: Install ruff (version pinned in requirements-test.txt)
        run: |
          python -m pip install --upgrade pip
          pip install $(grep '^ruff==' requirements-test.txt)

      - name: Lint with ruff
        run: |
          ruff check custom_components/pettracer/ --output-format=github

      - name: Check formatting with ruff
        run: |
          ruff format --check custom_components/pettracer/

  validate:
    name: Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Validate manifest
        run: |
          python -c "import json; json.load(open('custom_components/pettracer/manifest.json'))"

      - name: Validate strings.json
        run: |
          python -c "import json; json.load(open('custom_components/pettracer/strings.json'))"

      - name: Validate translations
        run: |
          python -c "import json; json.load(open('custom_components/pettracer/translations/en.json'))"

      - name: Check HACS compatibility
        run: |
          python -c "import json; json.load(open('hacs.json'))"
